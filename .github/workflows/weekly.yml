name: Weekly Scan 06:30 UK

on:
  schedule:
    - cron: '30 5 * * 6'  # 05:30 UTC = 06:30 BST (summer). Change to '30 6 * * 6' for winter GMT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install requests beautifulsoup4 pandas lxml

      - name: Run scanner
        run: python scanner.py

      - name: Commit CSV back to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add analyst_targets_*.csv
          git commit -m "Weekly scan $(date +%Y-%m-%d)" || echo "No changes to commit"
          git push

